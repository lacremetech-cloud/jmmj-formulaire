<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#24245c">
  <meta name="robots" content="noindex">
  <title>Admin JMMJ</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css">
  <style>
    .shell { max-width: 1000px; padding-bottom: 40px; }
    .login { max-width: 420px; margin: 0 auto; }
    .login .btn { width: 100%; margin-top: 6px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .search { flex: 1 1 240px; height: 50px; padding: 0 16px; font: inherit; font-size: 16px; border: 1.5px solid transparent; border-radius: 14px; background: var(--field); outline: none; }
    .search:focus { border-color: var(--navy); background: #fff; }
    .toolbar .btn { flex: 0 0 auto; height: 50px; padding: 0 18px; font-size: 15px; }
    .btn.light { background: #fff; color: var(--navy); border: 1.5px solid var(--line); box-shadow: none; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
    .stat { background: var(--field); border-radius: 16px; padding: 14px 16px; }
    .stat b { display: block; font-size: 26px; font-weight: 800; color: var(--navy); }
    .stat span { font-size: 12.5px; color: var(--muted); }
    .stat.hl { background: linear-gradient(135deg, var(--navy-2), var(--navy)); }
    .stat.hl b, .stat.hl span { color: #fff; }
    .list { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
    .item { border: 1.5px solid var(--line); border-radius: 18px; padding: 16px; font-size: 14px; line-height: 1.55; }
    .item-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .item-head b { font-size: 16px; }
    .item time { display: block; color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .item a { color: var(--navy); font-weight: 600; text-decoration: none; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .tag { background: #ececf8; color: var(--navy); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; }
    .tag.red { background: var(--red-soft); color: #b42318; }
    .pill { flex: none; font-weight: 700; font-size: 11.5px; padding: 4px 9px; border-radius: 8px; }
    .pill.yes { background: #e2f6ec; color: var(--ok); }
    .pill.no { background: var(--field); color: var(--muted); }
    .msg { margin-top: 4px; padding: 10px 12px; border-radius: 12px; background: var(--field); white-space: pre-wrap; word-break: break-word; }
    .wa { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; height: 44px; border-radius: 12px; background: #25d366; color: #fff !important; font-weight: 700; font-size: 14px; text-decoration: none; }
    .wa svg { width: 18px; height: 18px; }
    .wa:active { transform: scale(0.98); }
    .del { background: none; border: 0; color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; margin-top: 10px; }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; grid-column: 1 / -1; }
    .label-sm { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-top: 10px; }
  </style>
</head>
<body>
<div class="page">
<header class="hero">
  <div class="hero-inner" style="max-width:1000px">
    <div class="brand">
      <div class="brand-logo"><img src="assets/logo.png" alt=""></div>
      <div class="brand-text"><b>JMMJ</b>Association Culturelle</div>
    </div>
    <div class="eyebrow"><i></i>Espace admin</div>
    <h1>Réponses au <em>formulaire</em></h1>
  </div>
</header>

<main class="shell">
  <div class="card">
    <form class="login" id="login">
      <h2 style="margin:0 0 4px;font-size:22px;font-weight:800">Connexion</h2>
      <p style="margin:0 0 18px;color:var(--muted);font-size:14.5px">Saisissez le code d'accès admin.</p>
      <div class="field">
        <input type="password" id="code" placeholder=" " autocomplete="current-password" autocapitalize="characters">
        <label for="code">Code d'accès</label>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </div>
      <div class="error" id="login-error"></div>
      <button class="btn" type="submit" id="login-btn">Se connecter</button>
    </form>

    <div id="app" hidden>
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <input type="search" class="search" id="search" placeholder="Rechercher…">
        <button class="btn red" type="button" id="csv">Exporter CSV</button>
        <button class="btn light" type="button" id="refresh">Actualiser</button>
        <button class="btn light" type="button" id="logout">Déconnexion</button>
      </div>
      <div class="list" id="list"></div>
    </div>
  </div>
</main>

<script src="config.js"></script>
<script>
const LABELS = {
  cours_hebdo: "Cours hebdomadaires",
  arabe_intensif: "Arabe intensif / CPF / Démetrias",
  coran_tajwid: "Coran / Tajwid / Nouraniya",
  cours_en_ligne: "Cours en ligne",
};
const KEY = "jmmj_admin_code";
const $ = (id) => document.getElementById(id);
let rows = [];

function storage(action, value) {
  try {
    if (action === "get") return sessionStorage.getItem(KEY);
    if (action === "set") sessionStorage.setItem(KEY, value);
    if (action === "del") sessionStorage.removeItem(KEY);
  } catch (_) { return null; }
}

async function rpc(fn, body) {
  const { supabaseUrl, supabaseKey } = window.JMMJ_CONFIG;
  const res = await fetch(`${supabaseUrl}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: supabaseKey },
    body: JSON.stringify(body),
  });
  const text = await res.text();
  if (!res.ok) {
    const err = new Error(text);
    err.badCode = text.includes("code_invalide");
    throw err;
  }
  return text ? JSON.parse(text) : null;
}

// Message WhatsApp pré-rempli envoyé aux personnes qui ont rempli le formulaire
const WHATSAPP_MESSAGE = `Salam aleykoum 🌸

Voici les informations pour les cours de JMMJ :

📚 Cours d'islam : lundi, mardi ou mercredi soir, à partir de 18h30, selon l'âge, le niveau et les places disponibles. Pour les plus de 30 ans, les cours ont lieu uniquement le mercredi.

📖 Cours de Coran : dimanche de 18h30 à 20h00.

💶 Tarifs annuels, supports de cours inclus :
* Islam + Coran : 330 €
* Islam uniquement : 180 €

📞 Pour les inscriptions, les disponibilités et les horaires précis, contactez directement Ansa Racha à JMMJ au 07 69 96 14 22.`;

// Numéro au format international sans « + » (06… → 336…), attendu par wa.me
function waNumber(tel) {
  let n = String(tel || "").replace(/[^0-9+]/g, "");
  if (n.startsWith("+")) n = n.slice(1);
  else if (n.startsWith("00")) n = n.slice(2);
  else if (/^0[1-9]\d{8}$/.test(n)) n = "33" + n.slice(1);
  return n;
}
const waLink = (tel) => `https://wa.me/${waNumber(tel)}?text=${encodeURIComponent(WHATSAPP_MESSAGE)}`;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = (iso) => new Date(iso).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" });
const fmtBirth = (d) => (d ? d.split("-").reverse().join("/") : "");
const labels = (arr) => (arr || []).map((v) => LABELS[v] || v);

async function load(code) {
  rows = await rpc("jmmj_admin_list", { p_code: code });
  render();
}

function render() {
  const q = $("search").value.trim().toLowerCase();
  const shown = rows.filter((r) => !q || [r.nom_prenom, r.telephone, r.email, r.message].join(" ").toLowerCase().includes(q));

  const count = (group, key) => rows.filter((r) => r[group].includes(key)).length;
  $("stats").innerHTML = [
    [rows.length, "réponses"],
    [rows.filter((r) => r.recontact).length, "à recontacter"],
    ...Object.keys(LABELS).map((k) => [count("pour_vous", k), LABELS[k]]),
  ].map(([n, l], i) => `<div class="stat${i < 2 ? " hl" : ""}"><b>${n}</b><span>${esc(l)}</span></div>`).join("");

  if (!shown.length) {
    $("list").innerHTML = `<div class="empty">${rows.length ? "Aucun résultat." : "Aucune réponse pour l'instant."}</div>`;
    return;
  }
  $("list").innerHTML = shown.map((r) => `
    <div class="item">
      <div class="item-head">
        <b>${esc(r.nom_prenom)}</b>
        <span class="pill ${r.recontact ? "yes" : "no"}">${r.recontact ? "À recontacter" : "Pas de rappel"}</span>
      </div>
      <time>${fmtDate(r.created_at)}</time>
      <div>
        ${r.telephone ? `📞 <a href="tel:${esc(r.telephone)}">${esc(r.telephone)}</a>` : ""}
        ${r.telephone && r.email ? " · " : ""}
        ${r.email ? `✉️ <a href="mailto:${esc(r.email)}">${esc(r.email)}</a>` : ""}
        ${r.date_naissance ? ` · né(e) le ${fmtBirth(r.date_naissance)}` : ""}
      </div>
      ${r.pour_vous.length ? `<div class="label-sm">Intérêts</div><div class="tags">${labels(r.pour_vous).map((l) => `<span class="tag">${esc(l)}</span>`).join("")}</div>` : ""}
      ${r.message ? `<div class="label-sm">Message</div><div class="msg">${esc(r.message)}</div>` : ""}
      ${r.telephone ? `<a class="wa" href="${waLink(r.telephone)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3zM12 21.8c-1.8 0-3.5-.5-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4A9.8 9.8 0 0 1 2.2 12C2.2 6.6 6.6 2.2 12 2.2S21.8 6.6 21.8 12 17.4 21.8 12 21.8zM12 0C5.4 0 0 5.4 0 12c0 2.1.6 4.2 1.6 6L0 24l6.2-1.6A12 12 0 0 0 24 12C24 5.4 18.6 0 12 0z"/></svg>Envoyer les infos sur WhatsApp</a>` : ""}
      <button class="del" data-id="${esc(r.id)}" data-name="${esc(r.nom_prenom)}">Supprimer</button>
    </div>`).join("");
}

function exportCsv() {
  const head = ["Date", "Nom Prénom", "Téléphone", "E-mail", "Date de naissance", "Intérêts", "Recontact", "Message"];
  const cell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [...rows].reverse().map((r) => [
    fmtDate(r.created_at), r.nom_prenom, r.telephone, r.email, fmtBirth(r.date_naissance),
    labels(r.pour_vous).join(" | "), r.recontact ? "OUI" : "NON", r.message,
  ].map(cell).join(";"));
  // BOM + « ; » : s'ouvre directement avec les accents dans Excel (FR)
  const blob = new Blob(["﻿" + [head.map(cell).join(";"), ...lines].join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `formulaire-jmmj-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function showApp(show) {
  $("login").hidden = show;
  $("app").hidden = !show;
}

$("login").addEventListener("submit", async (e) => {
  e.preventDefault();
  const code = $("code").value.trim().toUpperCase();
  $("login-btn").disabled = true;
  $("login-error").classList.remove("show");
  try {
    await load(code);
    storage("set", code);
    showApp(true);
  } catch (err) {
    $("login-error").textContent = err.badCode ? "Code incorrect." : "Connexion impossible. Réessayez.";
    $("login-error").classList.add("show");
  } finally {
    $("login-btn").disabled = false;
  }
});

$("search").addEventListener("input", render);
$("csv").addEventListener("click", exportCsv);
$("refresh").addEventListener("click", () => load(storage("get")).catch(() => alert("Actualisation impossible.")));
$("logout").addEventListener("click", () => { storage("del"); rows = []; $("code").value = ""; showApp(false); });
$("list").addEventListener("click", async (e) => {
  const btn = e.target.closest(".del");
  if (!btn || !confirm(`Supprimer la réponse de ${btn.dataset.name} ?`)) return;
  const code = storage("get");
  await rpc("jmmj_admin_delete", { p_code: code, p_id: btn.dataset.id });
  await load(code);
});

const saved = storage("get");
if (saved) load(saved).then(() => showApp(true)).catch(() => storage("del"));
</script>
</body>
</html>
